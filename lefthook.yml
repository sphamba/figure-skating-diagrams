#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    frontend-lint:
      glob: "src/**/*.{ts,js,cjs,mjs,vue}"
      run: npx --no -- eslint -c eslint.config.ts --fix --cache {staged_files}
    frontend-format:
      glob: "src/**/*.{js,ts,vue,scss,html,md,json}"
      run: npx --no -- prettier --write --experimental-cli {staged_files} --ignore-path .gitignore && git add {staged_files}
    frontend-typecheck:
      glob: "src/**/*.{ts,vue}"
      run: npx --no -- vue-tsc --build --noEmit

commit-msg:
  commands:
    commitlint:
      run: npx --yes -p "@commitlint/cli" -p "@commitlint/config-conventional" -- commitlint --edit {1}
